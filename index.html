    /* 한글 글꼴은 영어(Newsreader)보다 커 보여서 87% 크기로 맞춰 불러와요 */
    fetch('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap')

      })
      .catch(function () {});
